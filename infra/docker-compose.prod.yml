# Production overrides for a single VPS. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes (and why):
#   * Caddy listens on the public ports 80 and 443 (the base file only binds 127.0.0.1:8080 for local development).
#   * Caddy's certificates and ACME account live in named volumes. Without them every restart asks Let's Encrypt for new
#     certificates and you hit its rate limits.
#   * Logs are rotated so the disk never fills up.
#   * The legacy single-tenant stack is not part of production (never add `--profile legacy` on the server).
services:
  caddy:
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'   # HTTP/3
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: &rotate
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  api:
    logging: *rotate
  worker:
    logging: *rotate

  # Tuned for ONE 8 GB VPS shared with the api, worker, redis and the gateway (see docs/RUNBOOK.md 'Scaling and operations'):
  #   shared_buffers 2 GB (~25% of RAM)        effective_cache_size 5 GB (planner hint: buffers + OS cache, not an allocation)
  #   work_mem 16 MB (per sort/hash node; with max_connections 200 the worst case is bounded by mem_limit below)
  #   checkpoint_timeout 15 min + max_wal_size 4 GB: fewer, smoother checkpoints;  wal_compression: less WAL I/O
  #   autovacuum_vacuum_scale_factor 0.05: vacuum busy tables at 5% dead rows instead of the default 20%
  #   log_min_duration_statement 500: slow queries show up in the logs
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=4GB
      - -c
      - log_min_duration_statement=500
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    shm_size: 512m
    mem_limit: 4g
    logging: *rotate

  # Redis on the server: more room than the 192 MB development default.
  redis:
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory', '384mb', '--maxmemory-policy', 'noeviction']
    mem_limit: 512m
    logging: *rotate
  wa-gateway:
    logging: *rotate

volumes:
  caddy-data:
  caddy-config:
