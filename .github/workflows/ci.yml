name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - ruff, pytest, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: cf_migrate }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret
      OPENWA_WEBHOOK_SECRET: ci-only-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: python -m pytest
      - name: Migrations apply, roll back and re-apply on a scratch database
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/cf_migrate
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend - typecheck + build, website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '{frontend,website}/package-lock.json' }
      - name: React app (tsc --noEmit && vite build)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Marketing site (astro build)
        working-directory: website
        run: npm ci --no-audit --no-fund && npm run build

  e2e:
    name: End-to-end (compose stack with fake AI and fake send)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: connectflow
    steps:
      - uses: actions/checkout@v4
      - name: Write a throw-away infra/.env (CI only; nothing real)
        run: |
          rnd() { head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32; }
          cp infra/.env.example infra/.env
          {
            echo "POSTGRES_PASSWORD=$(rnd)"
            echo "JWT_SECRET=$(rnd)$(rnd)"
            echo "OPENWA_WEBHOOK_SECRET=$(rnd)"
            echo "OPENWA_DB_PASSWORD=$(rnd)"
            echo "BACKUP_PASSPHRASE=$(rnd)"
            echo "SEARXNG_SECRET=$(rnd)"
            echo "ADMIN_PASSWORD=Ci$(rnd)!9"
            echo "AI_FAKE=true"
            echo "OUTREACH_FAKE_SEND=true"
            echo "WEBHOOK_ALLOW_PRIVATE=true"
            echo "REAPER_ENABLED=false"
          } >> infra/.env
          # the last value of a key wins for compose and for pydantic; expose the admin password to the tests without printing it
          echo "E2E_ADMIN_PASSWORD=$(grep '^ADMIN_PASSWORD=' infra/.env | tail -1 | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Start the stack
        working-directory: infra
        run: docker compose --profile dev up -d --build --wait --wait-timeout 600   # dev profile = Mailpit, which the m2 suite reads
      - name: Run the e2e suites
        run: python3 backend/tests/run_e2e.py
      - name: Collect logs
        if: failure()
        working-directory: infra
        run: |
          mkdir -p ../ci-logs
          docker compose --profile dev ps > ../ci-logs/ps.txt || true
          for s in api worker wa-gateway postgres redis caddy; do docker compose logs --no-color --tail 500 $s > ../ci-logs/$s.log 2>&1 || true; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs
          path: |
            ci-logs/
            backend/tests/e2e/logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the stack
        if: always()
        working-directory: infra
        run: docker compose --profile dev down -v
