name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scanner self-test
        run: python infra/scripts/test_check_secrets.py
      - name: Scan the tree for secrets and personal data
        run: python infra/scripts/check-secrets.py --all-files
      - name: Scan full git history for forbidden files
        run: |
          bad=$(git log --all --name-only --pretty=format: | sort -u | grep -E '(^|/)(legacy|vendor|backups|installers)/|(^|/)\.env($|\.)|\.(sqlite3?|enc|pem|exe)$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files in history:"; echo "$bad"; exit 1; fi
